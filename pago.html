<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Politica de contenido: de donde puede cargar esta pagina. Ver la auditoria de seguridad (2026-10-21) antes de anadir un dominio. -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos | CAE-CH</title>
    <meta name="description" content="Pago en línea de los productos de un predio y de la suscripción mensual del GeoVisor del CAE-CH.">
    <meta name="robots" content="noindex, nofollow">
    <!-- PayPhone valida el dominio por el Referer: sin el origen, la cajita
         responde "acceso denegado". -->
    <meta name="referrer" content="origin-when-cross-origin">
    <meta name="theme-color" content="#E31E24">
    <link rel="icon" type="image/png" href="LOGO/favicon-caech.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="caech-ui.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--fuente-ui); background: var(--hueso); color: var(--grafito);
            line-height: 1.6; font-size: 14px; min-height: 100vh;
        }
        a { color: var(--rojo-caech); }
        header {
            background: var(--blanco); border-bottom: 3px solid var(--rojo-caech);
        }
        .barra {
            max-width: 640px; margin: 0 auto; padding: 12px 16px;
            display: flex; align-items: center; gap: 16px;
        }
        .barra img { height: 38px; width: auto; display: block; }
        .barra span {
            font-size: 12px; font-weight: 700; letter-spacing: var(--tracking-caps);
            text-transform: uppercase; color: var(--grafito-med);
            border-left: 1px solid var(--borde-marcado); padding-left: 16px;
        }
        main { max-width: 640px; margin: 28px auto 48px; padding: 0 16px; }
        .tarjeta {
            background: var(--blanco); border: 1px solid var(--borde); border-radius: var(--radio);
            padding: 22px; margin-bottom: 18px;
        }
        h1 { font-size: 20px; margin-bottom: 6px; }
        .sub { color: var(--grafito-med); margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; margin: 6px 0 4px; }
        td { padding: 7px 0; border-bottom: 1px solid var(--borde); vertical-align: top; }
        td:last-child { text-align: right; }
        tr.total td { font-weight: 700; font-size: 16px; border-bottom: 0; }
        .mono { font-family: var(--fuente-mono); word-break: break-all; }
        .tenue { color: var(--grafito-sua); font-size: 12.5px; }
        .aviso {
            padding: 12px 14px; border-radius: var(--radio); margin-bottom: 16px; line-height: 1.55;
            border: 1px solid; border-left-width: 3px;
        }
        .aviso.info  { background: #EAF1F8; color: #17375E; border-color: #C7DAEC; border-left-color: #2563A8; }
        .aviso.exito { background: #E9F5EC; color: #14532D; border-color: #C8E6D0; border-left-color: #1E8449; }
        .aviso.error { background: #FDECEA; color: #8E1015; border-color: #F5C6C0; border-left-color: var(--rojo-caech); }
        .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
        #pp-button { margin-top: 16px; min-height: 40px; }
        .cargando { display: flex; align-items: center; gap: 10px; color: var(--grafito-med); }
        /* Factura: opcional, encima de la cajita. */
        .factura { border-top: 1px solid var(--borde); margin-top: 16px; padding-top: 14px; }
        .factura h2 {
            font-size: 11.5px; font-weight: 700; letter-spacing: var(--tracking-caps);
            text-transform: uppercase; color: var(--grafito-med); margin-bottom: 8px;
        }
        .opcion { display: flex; gap: 9px; align-items: flex-start; padding: 5px 0; cursor: pointer; }
        .opcion input { margin-top: 4px; accent-color: var(--rojo-caech); }
        .campos { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 10px 0 6px; }
        @media (min-width: 520px) { .campos { grid-template-columns: 150px 1fr; } .campos .ancho { grid-column: 1 / -1; } }
        .campo label { display: block; font-size: 12px; font-weight: 600; color: var(--grafito-med); margin-bottom: 3px; }
        .campo input, .campo select {
            width: 100%; padding: 8px 10px; font: inherit; color: var(--grafito);
            border: 1px solid var(--borde-marcado); border-radius: var(--radio); background: var(--blanco);
        }
        .campo input:focus, .campo select:focus { outline: 2px solid var(--rojo-humo); border-color: var(--rojo-caech); }
        .resumen-factura { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
        .enlace { background: none; border: 0; padding: 0; font: inherit; color: var(--rojo-caech); cursor: pointer; text-decoration: underline; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>

<header>
    <div class="barra">
        <a href="index.html" title="Volver al sitio del CAE-CH">
            <img src="LOGO/logo-caech.png" alt="CAE-CH" width="520" height="188">
        </a>
        <span>Pagos</span>
    </div>
</header>

<main>
    <div class="tarjeta" id="contenido">
        <p class="cargando"><i class="fas fa-circle-notch fa-spin"></i> Comprobando su sesión…</p>
    </div>
    <p class="tenue">
        El pago lo procesa <b>PayPhone</b>; la plataforma no ve ni guarda los datos de su tarjeta.
        Condiciones del servicio en los <a href="legal.html#terminos">Términos</a> y la
        <a href="legal.html#privacidad">Política de privacidad</a>.
        ¿Problemas con un cobro? Escriba a <a href="mailto:caechoficial@gmail.com">caechoficial@gmail.com</a>
        con el número de transacción.
    </p>
</main>

<script src="caech-acceso.js"></script>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  Pago de un predio con la Cajita de PayPhone, en las dos fases que exige:
//
//    pago.html?clave=…                      el Worker prepara la transacción y
//                                           aquí se dibuja la cajita
//    pago.html?suscripcion=1[&clave=…]      igual, para un ciclo de suscripción;
//                                           la clave es el predio al que se vuelve
//    pago.html?id=…&clientTransactionId=…   PayPhone devuelve aquí (es la URL de
//                                           respuesta de la aplicación) y el
//                                           Worker confirma el pago
//
//  Lo que habilita el predio o abre el ciclo es la confirmación en el Worker, que coteja monto,
//  cuenta y transacción contra lo que preparó. Esta página no decide nada.
// ─────────────────────────────────────────────────────────────────────────────
(function () {
    'use strict';
    const acceso = window.caechAcceso;
    const caja = document.getElementById('contenido');
    const params = new URLSearchParams(location.search);

    const esc = v => String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const usd = c => 'USD ' + (c / 100).toFixed(2).replace('.', ',');
    const fecha = iso => new Date(iso).toLocaleDateString('es-EC', { day: '2-digit', month: 'long', year: 'numeric' });
    const alVisor = clave => 'geovisor.html?clave=' + encodeURIComponent(clave);

    function pintar(html) { caja.innerHTML = html; }

    function cargando(texto) {
        pintar('<p class="cargando"><i class="fas fa-circle-notch fa-spin"></i> ' + esc(texto) + '</p>');
    }

    function desglose(clave, t) {
        return '<table><tbody>'
            + '<tr><td>Predio</td><td class="mono">' + esc(clave) + '</td></tr>'
            + '<tr><td>Incluye</td><td>DICAT en PDF, CSV y DXF<br><span class="tenue">durante '
            + (t.dias_acceso || 30) + ' días</span></td></tr>'
            + (t.descuento_colegiado || t.descuento_suscriptor
                ? '<tr><td>Precio de ' + (t.descuento_colegiado ? 'colegiado' : 'suscriptor')
                  + '</td><td>50 % de descuento<br><span class="tenue">precio regular '
                  + usd(t.precio_publico) + '</span></td></tr>'
                : '')
            + '<tr><td>Base imponible</td><td>' + usd(t.base) + '</td></tr>'
            + '<tr><td>IVA ' + t.iva_porcentaje + ' %</td><td>' + usd(t.iva) + '</td></tr>'
            + '<tr class="total"><td>Total</td><td>' + usd(t.precio) + '</td></tr>'
            + '</tbody></table>';
    }

    function desgloseSuscripcion(p, t) {
        return '<table><tbody>'
            + '<tr><td>Suscripción mensual</td><td>' + (t.cupo_suscripcion === 1 ? '1 predio gratuito' : t.cupo_suscripcion + ' predios gratuitos') + ' por ciclo'
            + '<br><span class="tenue">los demás con el 50 % de descuento</span></td></tr>'
            + '<tr><td>Base imponible</td><td>' + usd(p.base) + '</td></tr>'
            + '<tr><td>IVA ' + t.iva_porcentaje + ' %</td><td>' + usd(p.iva) + '</td></tr>'
            + '<tr class="total"><td>Total</td><td>' + usd(p.monto) + '</td></tr>'
            + '</tbody></table>';
    }

    /** El predio del que se venía, si lo hay: una suscripción puede no tenerlo. */
    const conPredio = clave => clave && clave !== 'SUSCRIPCION';

    // La cajita se carga solo cuando hace falta: es código de PayPhone y no
    // tiene por qué bajar en la vuelta ni en los errores.
    function cargarCajita() {
        return new Promise((resolver, rechazar) => {
            if (window.PPaymentButtonBox) return resolver();
            const css = document.createElement('link');
            css.rel = 'stylesheet';
            css.href = 'https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.css';
            document.head.appendChild(css);
            const js = document.createElement('script');
            js.type = 'module';
            js.src = 'https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.js';
            js.onload = () => {
                // El módulo publica la clase al evaluarse; se espera un instante.
                let n = 0;
                const t = setInterval(() => {
                    if (window.PPaymentButtonBox) { clearInterval(t); resolver(); }
                    else if (++n > 50) { clearInterval(t); rechazar(new Error('sin PPaymentButtonBox')); }
                }, 100);
            };
            js.onerror = () => rechazar(new Error('no cargó la cajita'));
            document.head.appendChild(js);
        });
    }

    // ── Fase 1: preparar y mostrar la cajita ────────────────────────────
    async function preparar(clave) {
        cargando('Preparando el pago…');
        const estado = await acceso.peticion('GET', '/api/predios/estado?clave=' + encodeURIComponent(clave));
        if (estado.estado === 200 && estado.datos.habilitado) {
            return pintar('<h1>Este predio ya está habilitado</h1>'
                + '<div class="aviso exito">Puede descargar el DICAT, el CSV y el DXF'
                + (estado.datos.vence_en ? ' hasta el ' + fecha(estado.datos.vence_en) : '') + '.</div>'
                + '<div class="acciones"><a class="btn" href="' + esc(alVisor(estado.datos.clave_catastral)) + '">'
                + 'Volver al visor con el predio</a></div>');
        }

        const r = await acceso.peticion('POST', '/api/pagos', { clave_catastral: clave });
        if (r.estado !== 201) return noSePuedePagar(r, alVisor(clave), 'Volver al visor');

        const d = r.datos;
        return mostrarCajita(d, '<h1>Habilitar el predio</h1>'
            + '<p class="sub">Un solo pago habilita los tres productos de este predio en su cuenta.</p>'
            + desglose(d.pago.clave_catastral, d.tarifa));
    }

    async function prepararSuscripcion(clave) {
        cargando('Preparando la suscripción…');
        const r = await acceso.peticion('POST', '/api/pagos', { concepto: 'suscripcion', clave_catastral: clave || '' });
        if (r.estado !== 201) return noSePuedePagar(r, clave ? alVisor(clave) : 'panel.html', clave ? 'Volver al visor' : 'Ir a mi cuenta');

        const d = r.datos;
        return mostrarCajita(d, '<h1>Suscripción mensual</h1>'
            + '<p class="sub">Vale por un mes desde hoy o, si renueva antes de tiempo, desde que termine el ciclo vigente. '
            + 'No se renueva ni se debita sola: cada ciclo se paga aquí. Lo que no use en un ciclo no pasa al siguiente.</p>'
            + desgloseSuscripcion(d.pago, d.tarifa));
    }

    function noSePuedePagar(r, volver, rotulo) {
        return pintar('<h1>No se puede pagar ahora</h1>'
            + '<div class="aviso ' + (r.estado === 503 ? 'info' : 'error') + '">'
            + esc((r.datos && r.datos.error) || 'No se pudo preparar el pago.') + '</div>'
            + '<div class="acciones"><a class="btn btn-outline" href="' + esc(volver) + '">' + esc(rotulo) + '</a></div>');
    }

    async function mostrarCajita(d, encabezado) {
        pintar(encabezado
            + '<div class="factura" id="factura"></div>'
            + '<div id="pp-espera" class="aviso info" hidden style="margin-top:16px">Guarde los datos de la factura para continuar al pago.</div>'
            + '<div id="pp-button" hidden><p class="cargando"><i class="fas fa-circle-notch fa-spin"></i> Cargando el formulario de pago…</p></div>'
            + '<p class="tenue" style="margin-top:12px">El formulario vence a los 10 minutos; si caduca, recargue la página. '
            + 'Transacción <span class="mono">' + esc(d.pago.id) + '</span>.</p>');

        // La cajita se dibuja una sola vez, cuando la factura ya está decidida:
        // si se pide a nombre propio, primero se guardan los datos.
        let dibujada = false;
        async function habilitarPago(listo) {
            document.getElementById('pp-espera').hidden = listo;
            document.getElementById('pp-button').hidden = !listo;
            if (!listo || dibujada) return;
            dibujada = true;
            try {
                await cargarCajita();
                document.getElementById('pp-button').innerHTML = '';
                new window.PPaymentButtonBox(d.cajita).render('pp-button');
            } catch (e) {
                document.getElementById('pp-button').innerHTML =
                    '<div class="aviso error">No se pudo cargar el formulario de PayPhone. Revise su conexión y recargue la página.</div>';
            }
        }

        formularioFactura(document.getElementById('factura'), d.pago.id, null, d.facturacion_anterior, habilitarPago);
    }

    // ── Factura: consumidor final o a nombre de quien paga ──────────────
    const ROTULO_DOC = { cedula: 'cédula', ruc: 'RUC', pasaporte: 'pasaporte' };
    const rutaFactura = id => '/api/pagos/' + encodeURIComponent(id) + '/facturacion';

    /**
     * Dibuja la elección de factura en `cont`. `alCambiar(listo)` avisa si el
     * pago puede seguir: con «a mi nombre» sin guardar, no. Los datos de una
     * compra anterior se aplican solos y se muestran resumidos, con «Cambiar».
     */
    function formularioFactura(cont, pagoId, actual, anterior, alCambiar) {
        let vigente = actual && actual.tipo !== 'consumidor_final' ? actual : null;

        function resumen(f) {
            cont.innerHTML = '<h2>Factura</h2>'
                + '<div class="resumen-factura"><span>A nombre de <b>' + esc(f.nombre) + '</b> · '
                + esc(ROTULO_DOC[f.tipo] || f.tipo) + ' <span class="mono">' + esc(f.identificacion) + '</span>'
                + (f.correo ? '<br><span class="tenue">Se envía a ' + esc(f.correo) + '</span>' : '') + '</span>'
                + '<button type="button" class="enlace" id="fac-cambiar">Cambiar</button></div>';
            document.getElementById('fac-cambiar').addEventListener('click', () => formulario(f));
            alCambiar(true);
        }

        function formulario(previo) {
            const p = previo || {};
            const conDatos = !!previo;
            cont.innerHTML = '<h2>Factura</h2>'
                + '<label class="opcion"><input type="radio" name="fac" value="cf"' + (conDatos ? '' : ' checked') + '>'
                + '<span>A consumidor final <span class="tenue">— sin datos personales</span></span></label>'
                + '<label class="opcion"><input type="radio" name="fac" value="datos"' + (conDatos ? ' checked' : '') + '>'
                + '<span>A mi nombre o al de mi empresa <span class="tenue">— para deducirla como gasto</span></span></label>'
                + '<div id="fac-campos"' + (conDatos ? '' : ' hidden') + '>'
                + '<div class="campos">'
                + '<div class="campo"><label for="fac-tipo">Identificación</label><select id="fac-tipo">'
                + ['cedula', 'ruc', 'pasaporte'].map(t => '<option value="' + t + '"' + (p.tipo === t ? ' selected' : '') + '>'
                    + (t === 'cedula' ? 'Cédula' : t === 'ruc' ? 'RUC' : 'Pasaporte') + '</option>').join('')
                + '</select></div>'
                + '<div class="campo"><label for="fac-ident">Número</label><input id="fac-ident" autocomplete="off" maxlength="20" value="' + esc(p.identificacion || '') + '"></div>'
                + '<div class="campo ancho"><label for="fac-nombre">Nombre o razón social</label><input id="fac-nombre" autocomplete="name" maxlength="150" value="' + esc(p.nombre || '') + '"></div>'
                + '<div class="campo ancho"><label for="fac-correo">Correo para la factura <span class="tenue">(opcional; si no, el de su cuenta)</span></label><input id="fac-correo" type="email" autocomplete="email" maxlength="254" value="' + esc(p.correo || '') + '"></div>'
                + '<div class="campo ancho"><label for="fac-dir">Dirección <span class="tenue">(opcional)</span></label><input id="fac-dir" autocomplete="street-address" maxlength="200" value="' + esc(p.direccion || '') + '"></div>'
                + '</div>'
                + '<p class="tenue">Estos datos se usan solo para emitir la factura electrónica de este pago y se conservan '
                + 'con él por la obligación tributaria. <a href="legal.html#privacidad">Política de privacidad</a>.</p>'
                + '<div id="fac-error"></div>'
                + '<div class="acciones"><button type="button" class="btn" id="fac-guardar">Guardar datos de la factura</button></div>'
                + '</div>';

            const campos = document.getElementById('fac-campos');
            cont.querySelectorAll('input[name="fac"]').forEach(r => r.addEventListener('change', async () => {
                const datos = r.value === 'datos' && r.checked;
                campos.hidden = !datos;
                if (datos) return alCambiar(false);
                // Vuelve a consumidor final: si había datos guardados, se borran.
                if (vigente) {
                    const x = await acceso.peticion('PUT', rutaFactura(pagoId), { tipo: 'consumidor_final' });
                    if (x.estado === 200) vigente = null;
                }
                alCambiar(true);
            }));
            document.getElementById('fac-guardar').addEventListener('click', guardar);
            alCambiar(!conDatos);
        }

        async function guardar() {
            const b = document.getElementById('fac-guardar');
            const err = document.getElementById('fac-error');
            b.disabled = true;
            const x = await acceso.peticion('PUT', rutaFactura(pagoId), {
                tipo: document.getElementById('fac-tipo').value,
                identificacion: document.getElementById('fac-ident').value,
                nombre: document.getElementById('fac-nombre').value,
                correo: document.getElementById('fac-correo').value,
                direccion: document.getElementById('fac-dir').value
            });
            b.disabled = false;
            if (x.estado !== 200) {
                err.innerHTML = '<div class="aviso error">' + esc((x.datos && x.datos.error) || 'No se pudieron guardar los datos.') + '</div>';
                return;
            }
            vigente = x.datos.facturacion;
            resumen(vigente);
        }

        if (vigente) return resumen(vigente);
        if (anterior) {
            // Los mismos datos que la vez anterior: se aplican y se pueden cambiar.
            alCambiar(false);
            acceso.peticion('PUT', rutaFactura(pagoId), anterior).then(x => {
                if (x.estado === 200) { vigente = x.datos.facturacion; resumen(vigente); }
                else formulario(null);
            });
            return;
        }
        formulario(null);
    }

    /** Debajo de un pago aprobado: la factura que va a salir, o la emitida. */
    function bloqueFacturaAprobado(p) {
        const f = p.facturacion || {};
        if (f.numero) {
            return '<div class="factura"><h2>Factura</h2><p>Emitida: <span class="mono">' + esc(f.numero) + '</span>'
                + (f.nombre ? ' a nombre de ' + esc(f.nombre) : ' a consumidor final') + '.</p></div>';
        }
        return '<div class="factura" id="factura-aprobado"></div>';
    }

    function activarFacturaAprobado(p) {
        const cont = document.getElementById('factura-aprobado');
        if (!cont) return;
        const f = p.facturacion || {};
        if (f.tipo && f.tipo !== 'consumidor_final') return formularioFactura(cont, p.id, f, null, () => {});
        cont.innerHTML = '<h2>Factura</h2><p>Se emitirá a consumidor final. '
            + '<button type="button" class="enlace" id="fac-pedir">La necesito a mi nombre</button></p>';
        document.getElementById('fac-pedir').addEventListener('click', () =>
            formularioFactura(cont, p.id, null, null, () => {}));
    }

    // ── Fase 2: confirmar a la vuelta de PayPhone ───────────────────────
    async function confirmar(id, clientTx) {
        cargando('Comprobando el pago con PayPhone…');
        const r = await acceso.peticion('POST', '/api/pagos/confirmar', { id: id, clientTransactionId: clientTx });
        const d = r.datos || {};

        if (r.estado === 502 && d.reintentar) {
            return pintar('<h1>Todavía no tenemos respuesta</h1>'
                + '<div class="aviso info">' + esc(d.error) + '</div>'
                + '<div class="acciones"><button class="btn" onclick="location.reload()">Volver a comprobar</button></div>');
        }
        if (r.estado !== 200 || !d.pago) {
            return pintar('<h1>No se pudo comprobar el pago</h1>'
                + '<div class="aviso error">' + esc(d.error || 'Error desconocido.') + '</div>');
        }

        const p = d.pago;
        const esSuscripcion = p.concepto === 'suscripcion';
        if (p.estado === 'aprobado' && esSuscripcion) {
            return pintar('<h1>Suscripción activa</h1>'
                + '<div class="aviso exito">' + esc(d.mensaje)
                + (d.vence_en ? ' Este ciclo pagado termina el ' + fecha(d.vence_en) + '.' : '') + '</div>'
                + desgloseSuscripcion(p, d.tarifa)
                + '<p class="tenue">Transacción PayPhone <span class="mono">' + esc(p.transaccion || '—') + '</span>'
                + (p.autorizacion ? ' · autorización <span class="mono">' + esc(p.autorizacion) + '</span>' : '')
                + '</p>'
                + '<div class="acciones" style="margin-top:14px">'
                + (conPredio(p.clave_catastral)
                    ? '<a class="btn" href="' + esc(alVisor(p.clave_catastral)) + '">Volver al visor con el predio</a>'
                    : '<a class="btn" href="geovisor.html">Ir al GeoVisor</a>')
                + '<a class="btn btn-outline" href="panel.html">Mi suscripción</a></div>'
                + bloqueFacturaAprobado(p));
            return activarFacturaAprobado(p);
        }
        if (p.estado === 'aprobado') {
            return pintar('<h1>Pago aprobado</h1>'
                + '<div class="aviso exito">' + esc(d.mensaje)
                + (d.vence_en ? ' Queda habilitado hasta el ' + fecha(d.vence_en) + '.' : '') + '</div>'
                + desglose(p.clave_catastral, Object.assign({}, d.tarifa, { base: p.base, iva: p.iva, precio: p.monto }))
                + '<p class="tenue">Transacción PayPhone <span class="mono">' + esc(p.transaccion || '—') + '</span>'
                + (p.autorizacion ? ' · autorización <span class="mono">' + esc(p.autorizacion) + '</span>' : '')
                + '</p>'
                + '<div class="acciones" style="margin-top:14px"><a class="btn" href="' + esc(alVisor(p.clave_catastral)) + '">'
                + 'Volver al visor con el predio</a>'
                + '<a class="btn btn-outline" href="panel.html">Mis pagos</a></div>'
                + bloqueFacturaAprobado(p));
            return activarFacturaAprobado(p);
        }
        const reintento = esSuscripcion
            ? 'pago.html?suscripcion=1' + (conPredio(p.clave_catastral) ? '&clave=' + encodeURIComponent(p.clave_catastral) : '')
            : 'pago.html?clave=' + encodeURIComponent(p.clave_catastral);
        return pintar('<h1>' + (p.estado === 'cancelado' ? 'Pago cancelado' : 'Pago no completado') + '</h1>'
            + '<div class="aviso ' + (p.estado === 'cancelado' ? 'info' : 'error') + '">' + esc(d.mensaje) + '</div>'
            + '<div class="acciones"><a class="btn" href="' + esc(reintento) + '">Intentar de nuevo</a>'
            + '<a class="btn btn-outline" href="' + esc(conPredio(p.clave_catastral) ? alVisor(p.clave_catastral) : 'geovisor.html')
            + '">Volver al visor</a></div>');
    }

    async function arrancar() {
        if (!acceso) return pintar('<div class="aviso error">Falta el control de acceso del sitio. Recargue la página.</div>');
        await acceso.sesion();
        if (!acceso.perfil()) {
            pintar('<h1>Ingrese para continuar</h1>'
                + '<p class="sub">El pago queda asociado a su cuenta: es la que podrá descargar el predio.</p>'
                + '<div class="acciones"><button class="btn" id="btn-ingresar">Ingresar</button></div>');
            document.getElementById('btn-ingresar').addEventListener('click', () => acceso.abrirIngreso(arrancar));
            return;
        }

        const id = parseInt(params.get('id') || '', 10);
        const clientTx = params.get('clientTransactionId');
        const clave = params.get('clave');
        if (id && clientTx) return confirmar(id, clientTx);
        if (params.get('suscripcion')) return prepararSuscripcion(clave);
        if (clave) return preparar(clave);
        pintar('<h1>No hay ningún predio que pagar</h1>'
            + '<p class="sub">Elija un predio en el GeoVisor y pida su DICAT, CSV o DXF: si hace falta pagar, '
            + 'el visor lo trae hasta aquí.</p>'
            + '<div class="acciones"><a class="btn" href="geovisor.html">Ir al GeoVisor</a></div>');
    }

    arrancar();
}());
</script>
</body>
</html>
