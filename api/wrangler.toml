#  CAE-CH · API de afiliados
#  Despliegue:  npx wrangler deploy
#  Ver README.md para el paso a paso completo.

name = "caech-afiliados"
main = "src/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

# ── Dominio del API ─────────────────────────────────────────────────
# Se publica en un subdominio propio y no en workers.dev: la zona esta
# en esta misma cuenta, asi que Cloudflare crea el registro y la ruta.
[[routes]]
pattern = "api.cae-ch.org"
custom_domain = true

# ── Base de datos D1 ────────────────────────────────────────────────
# Pegue aqui el database_id que devuelve:
#   npx wrangler d1 create caech-afiliados
[[d1_databases]]
binding = "DB"
database_name = "caech-afiliados"
database_id = "ed634cd7-0ac2-4e13-a33c-531b930aeddc"

# ── Aseo automatico (sesiones vencidas y pases caducados) ───────────
[triggers]
crons = ["0 4 * * *"]

# ── Variables publicas ──────────────────────────────────────────────
# Los secretos NO van aqui. Se cargan con `npx wrangler secret put`:
#   PIMIENTA         obligatorio — sal global para hashear IPs
#   RESEND_API_KEY   solo si MAIL_PROVEEDOR = "resend"
[vars]
# Origenes que pueden llamar al API. Sin coincidencia, no se emite
# Access-Control-Allow-Origin: se falla cerrado, no abierto.
ORIGENES_PERMITIDOS = "https://cae-ch.org,https://www.cae-ch.org,https://misionarquitectura-blip.github.io,http://localhost:8788"

# URL publica de este Worker (para armar los enlaces de los correos).
API_URL = "https://api.cae-ch.org"

# Raiz del sitio, a donde vuelve el usuario tras verificar su correo.
# Se cambia a "https://cae-ch.org" cuando el dominio resuelva; mientras
# tanto apunta a donde el sitio esta de verdad, para no romper la vuelta.
SITIO_URL = "https://cae-ch.org"

# Coste de PBKDF2-SHA256. Medido sobre el mismo motor nativo:
#    50000 -> ~6 ms    100000 -> ~12 ms    210000 -> ~24 ms
# El plan gratuito de Workers corta en 10 ms de CPU por invocacion, asi
# que con plan gratuito use 50000; con Workers Paid deje 210000.
HASH_ITERACIONES = "50000"

# "consola" escribe el enlace en los logs (npx wrangler tail) sin enviar
# nada: es el modo util mientras el dominio no este verificado.
# "resend" envia de verdad (requiere RESEND_API_KEY y dominio verificado).
MAIL_PROVEEDOR = "consola"
MAIL_REMITENTE = "CAE-CH <no-responder@cae-ch.org>"

# "no" apaga el registro publico de cuentas sin volver a desplegar.
# Queda en "si", pero el alta se sigue negando sola mientras
# MAIL_PROVEEDOR sea "consola": sin correo saliente nadie podria confirmar
# su cuenta. Basta configurar Resend para que el registro funcione.
REGISTRO_ACTIVO = "si"

# Pase de cortesia (un DICAT por correo verificado). RETIRADO el
# 2026-09-04: el mapa se abrio al publico y, a cambio, los productos
# -PDF, CSV y DXF- pasaron a exigir cuenta de colegiado. No volver a
# encenderlo sin revisar `permisos()` en src/sesiones.js.
FREEMIUM_ACTIVO = "no"
